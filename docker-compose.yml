services:
  postgres:
    image: postgres:17
    container_name: document-generator-postgres
    environment:
      POSTGRES_DB: document_generator
      POSTGRES_USER: document_generator
      POSTGRES_PASSWORD: document_generator
    ports:
      - "5432:5432"
    volumes:
      - document-generator-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U document_generator -d document_generator"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  document-generator-postgres-data:
